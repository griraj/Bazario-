# ─── Server ───────────────────────────────────────────────────────────────────
server.port=8080
server.servlet.context-path=/api/v1

# ─── DataSource (H2 In-Memory for ZERO-CONFIG Local Dev) ──────────────────────
spring.datasource.url=jdbc:h2:mem:bazariodb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# ─── H2 Console ───────────────────────────────────────────────────────────────
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ─── JPA ──────────────────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# ─── Flyway ───────────────────────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ─── JWT ──────────────────────────────────────────────────────────────────────
# Override via environment variable in production – never commit real secrets
bazario.jwt.secret=${BAZARIO_JWT_SECRET:BazarioSuperSecretKeyForJWTSigningThatIsAtLeast256BitsLong!}
bazario.jwt.expiration-ms=${BAZARIO_JWT_EXPIRY_MS:86400000}

# ─── Logging ──────────────────────────────────────────────────────────────────
logging.level.com.bazario=DEBUG
logging.level.org.springframework.security=INFO

# ─── OpenAPI ──────────────────────────────────────────────────────────────────
springdoc.api-docs.path=/docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
